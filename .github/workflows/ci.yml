name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  core-only:
    # the core (hooks, CLI, emit) must work with no extras installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pytest
      - run: pytest -q tests/test_core.py tests/test_claude_code.py tests/test_cli.py
      - run: |
          agentmon demo --instant
          agentmon web && exit 1 || test $? -eq 2
          agentmon tui && exit 1 || test $? -eq 2
